name: Korean draft
on:
  push:
    branches: [korean-edition, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'oweixx/HowToLiveBetter-KR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/build-korean.py --check
      - run: python -m unittest discover -s tools/korean-tests
      - name: Prepare Korean preview
        run: |
          mkdir -p dist
          cp index.html og.png LICENSE LICENSE-CODE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: HowToLiveBetter-KR-preview
          path: dist/
