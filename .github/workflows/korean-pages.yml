name: Deploy Korean GitHub Pages
on:
  push:
    branches: [korean-edition]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korean-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'oweixx/HowToLiveBetter-KR' && github.ref == 'refs/heads/korean-edition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/build-korean.py --check
      - run: python -m unittest discover -s tools/korean-tests
      - uses: actions/configure-pages@v5
      - name: Prepare Korean site
        run: |
          mkdir -p dist
          cp index.html og.png LICENSE LICENSE-CODE dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
